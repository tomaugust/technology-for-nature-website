---
layout: default
---
<article class="page">
  <header class="page-header">
    <p class="eyebrow">{{ page.eyebrow | default: "Technology for Nature" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}
      <p class="lede">{{ page.summary }}</p>
    {% endif %}
  </header>
  <div class="content">
    {{ content }}
  </div>
</article>
